name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - dev           # triggers on push to dev branch
    paths:
      - "docs/**"     # only when something inside docs/ changes
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs site
        run: npm run build
        working-directory: docs
        env:
          NODE_ENV: production
          CI: true

      - name: Add .nojekyll (required for GitHub Pages to serve files with underscores)
        run: touch docs/out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: docs site from dev branch"
